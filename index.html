<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athens Debate - Dashboard</title>
  <style>
    :root {
      --bg-color: #237C85;
      --text-color: #FFFFFF;
      --input-bg: rgba(255, 255, 255, 0.15);
      --input-border: rgba(255, 255, 255, 0.4);
      --button-bg: #FFFFFF;
      --button-text: #237C85;
      --card-bg: rgba(0, 0, 0, 0.12);
      --record-red: #ff3b30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo Styling */
    .logo-wrapper {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-svg {
      width: 110px;
      height: 110px;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 8px;
      margin-top: 12px;
      margin-right: -8px;
      text-transform: uppercase;
    }

    /* Views Framework */
    .view {
      width: 100%;
      display: none;
      animation: fadeIn 0.4s ease-in-out;
    }

    .view.active {
      display: block;
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
      opacity: 0.9;
    }

    input[type="email"],
    input[type="password"],
    input[type="number"],
    select {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      color: var(--text-color);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    select option {
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    input:focus, select:focus {
      border-color: var(--text-color);
      background: rgba(255, 255, 255, 0.22);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background-color: var(--button-bg);
      color: var(--button-text);
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--text-color);
      color: var(--text-color);
    }

    .btn-action {
      background-color: #00d26a;
      color: #ffffff;
    }

    .error-msg {
      color: var(--record-red);
      background: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    /* Panels & Containers */
    .welcome-text {
      font-size: 26px;
      font-weight: 400;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    .panel {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--input-border);
      margin-top: 15px;
    }

    .panel-title {
      font-size: 20px;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .prompt-list {
      margin: 20px 0;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .prompt-item {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--input-border);
      padding: 14px;
      border-radius: 8px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .prompt-item:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .prompt-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      cursor: pointer;
      accent-color: var(--bg-color);
    }

    .prompt-item label {
      text-transform: none;
      letter-spacing: normal;
      font-size: 15px;
      line-height: 1.4;
      margin: 0;
      cursor: pointer;
    }

    /* Timers & Speech Views */
    .selected-prompt-box {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--input-border);
      padding: 18px;
      border-radius: 8px;
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 20px;
      font-style: italic;
    }

    .timer-display {
      font-size: 64px;
      font-weight: bold;
      letter-spacing: 2px;
      margin: 15px 0;
    }

    .timer-controls {
      display: flex;
      gap: 10px;
    }

    .timer-status {
      font-size: 22px;
      font-weight: 600;
      color: var(--record-red);
      margin-top: 15px;
      display: none;
      letter-spacing: 1px;
    }

    /* Speech Recording & Transcript */
    .rec-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 10px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .rec-indicator.active {
      opacity: 1;
    }

    .dot {
      width: 12px;
      height: 12px;
      background-color: var(--record-red);
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
    }

    .transcript-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--input-border);
      padding: 16px;
      border-radius: 8px;
      text-align: left;
      font-size: 15px;
      line-height: 1.6;
      max-height: 180px;
      overflow-y: auto;
      margin-top: 15px;
      display: none;
      word-wrap: break-word;
    }

    @keyframes pulse {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

        <div class="timer-controls">

        </div>

        <button class="btn btn-action" style="margin-top: 15px;" onclick="goToSpeechView()">START SPEECH (5 MIN)</button>
        <button class="btn btn-secondary" style="margin-top: 10px;" onclick="showView('generatorView')">← Back to Generator</button>

    </div>

        <div class="rec-indicator" id="recIndicator">

        <div class="timer-controls" style="margin-top: 10px;">
          <button class="btn" onclick="startSpeechTimer()">Start</button>

    let selectedPrompt = "";
    
    // Prep Timer (2 Min)
    let prepSeconds = 120;
    let prepInterval = null;

    // Speech Timer (5 Min)
    let speechSeconds = 300;
    let speechInterval = null;

    // Speech Recognition & Audio
    let recognition = null;
    let audioCtx = null;

    // Navigation
    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    // Login
    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      if (email === 'vathukrishnaswamy@gmail.com' && password === '11athensvk') {
        errorMsg.style.display = 'none';
        showView('welcomeView');
      } else {
        errorMsg.style.display = 'block';
      }
    }

    // Generator
    function generatePrompts() {
      const container = document.getElementById('promptContainer');
      const selectBtn = document.getElementById('selectBtn');
      let count = parseInt(document.getElementById('numPrompts').value);

      if (isNaN(count) || count < 1) count = 1;
      if (count > 10) count = 10;
      document.getElementById('numPrompts').value = count;

      container.innerHTML = '';
      selectBtn.style.display = 'none';
      selectedPrompt = '';

      const shuffled = [...topicBank].sort(() => 0.5 - Math.random());
      const selectedTopics = shuffled.slice(0, count);

      selectedTopics.forEach((topic, idx) => {
        const item = document.createElement('div');
        item.className = 'prompt-item';
        item.onclick = (e) => {
          if(e.target.tagName !== 'INPUT') {
            const cb = item.querySelector('input');
            cb.checked = !cb.checked;
            handleCheckboxSelect(cb);
          }
        };

        item.innerHTML = `
          <input type="checkbox" id="p_${idx}" name="prompt_choice" value="${escapeHtml(topic)}" onchange="handleCheckboxSelect(this)">
          <label for="p_${idx}">${topic}</label>
        `;
        container.appendChild(item);
      });
    }

    function handleCheckboxSelect(current) {
      const checkboxes = document.querySelectorAll('input[name="prompt_choice"]');
      checkboxes.forEach(cb => {
        if (cb !== current) cb.checked = false;
      });

      const selectBtn = document.getElementById('selectBtn');
      if (current.checked) {
        selectedPrompt = current.value;
        selectBtn.style.display = 'block';
      } else {
        selectedPrompt = '';
        selectBtn.style.display = 'none';
      }
    }

    // Start Prep
    function startPrep() {
      if (!selectedPrompt) return;
      document.querySelectorAll('.activePromptDisplay').forEach(el => {
        el.innerText = `"${selectedPrompt}"`;
      });
      resetPrepTimer();
      showView('prepTimerView');
    }

    // 2-MIN PREP TIMER LOGIC
    function updatePrepDisplay() {
      const mins = Math.floor(prepSeconds / 60).toString().padStart(2, '0');
      const secs = (prepSeconds % 60).toString().padStart(2, '0');
      document.getElementById('prepTimerDisplay').innerText = `${mins}:${secs}`;
    }

    function startPrepTimer() {
      if (prepInterval) return;
      document.getElementById('prepTimesUp').style.display = 'none';
      prepInterval = setInterval(() => {
        if (prepSeconds > 0) {
          prepSeconds--;
          updatePrepDisplay();
        } else {
          pausePrepTimer();
          document.getElementById('prepTimesUp').style.display = 'block';
          playBellSound();
        }
      }, 1000);
    }

    function pausePrepTimer() {
      if (prepInterval) {
        clearInterval(prepInterval);
        prepInterval = null;
      }
    }

    function resetPrepTimer() {
      pausePrepTimer();
      prepSeconds = 120;
      updatePrepDisplay();
      document.getElementById('prepTimesUp').style.display = 'none';
    }

    // Transition Prep -> Speech
    function goToSpeechView() {
      pausePrepTimer();
      resetSpeechTimer();
      showView('speechTimerView');
    }

    // 5-MIN SPEECH TIMER & RECORDING LOGIC
    function updateSpeechDisplay() {
      const mins = Math.floor(speechSeconds / 60).toString().padStart(2, '0');
      const secs = (speechSeconds % 60).toString().padStart(2, '0');
      document.getElementById('speechTimerDisplay').innerText = `${mins}:${secs}`;
    }

    function startSpeechTimer() {
      if (speechInterval) return;
      document.getElementById('speechTimesUp').style.display = 'none';
      startRecording();

      speechInterval = setInterval(() => {
        if (speechSeconds > 0) {
          speechSeconds--;
          updateSpeechDisplay();
        } else {
          pauseSpeechTimer();
          document.getElementById('speechTimesUp').style.display = 'block';
          playBellSound();
        }
      }, 1000);
    }

    function pauseSpeechTimer() {
      if (speechInterval) {
        clearInterval(speechInterval);
        speechInterval = null;
      }
      stopRecording();
    }

    function resetSpeechTimer() {
      pauseSpeechTimer();
      speechSeconds = 300;
      updateSpeechDisplay();
      document.getElementById('speechTimesUp').style.display = 'none';
      document.getElementById('transcriptBox').style.display = 'none';
      document.getElementById('transcriptText').innerText = "Listening for speech...";
      transcriptText = "";
    }

    // Web Speech API Integration for Recording & Transcription
    function startRecording() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      document.getElementById('recIndicator').classList.add('active');
      document.getElementById('transcriptBox').style.display = 'block';

      if (!SpeechRecognition) {
        document.getElementById('transcriptText').innerText = "Browser doesn't support live Speech-to-Text transcription. (Timer active)";
        return;
      }

      if (!recognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (event) => {
          let currentTranscript = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            currentTranscript += event.results[i][0].transcript;
          }
          document.getElementById('transcriptText').innerText = currentTranscript || transcriptText || "Listening for speech...";
        };

        recognition.onerror = (e) => {
          console.log("Speech Recognition Error:", e);
        };
      }

      try {
        recognition.start();
      } catch (err) {
        // Recognition already active
      }
    }

    function stopRecording() {
      document.getElementById('recIndicator').classList.remove('active');
      if (recognition) {
        try {
          recognition.stop();
        } catch (err) {}
      }
    }

    // Bell Sound Synthesizer
    function playBellSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 1.5);

        gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 1.5);
      } catch (e) {
        console.log("Audio alert error:", e);
      }
    }

    function escapeHtml(str) {
      return str.replace(/"/g, '&quot;');
    }
  </script>
