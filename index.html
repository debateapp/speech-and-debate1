<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudentVUE Gradebook</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts & Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8f9fa;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Hardcoded credentials
    const FIXED_EMAIL = "vathukrishnaswamy@gmail.com";
    const FIXED_PASS = "gray10Five";

    // Initialize fixed account directly in localStorage
    (function initializeDefaultAccount() {
      const storedUsers = JSON.parse(localStorage.getItem("studentvue_users") || "{}");
      storedUsers[FIXED_EMAIL.toLowerCase()] = { password: FIXED_PASS };
      localStorage.setItem("studentvue_users", JSON.stringify(storedUsers));
    })();

    // Subjects with themed styles & icons
    const SUBJECT_OPTIONS = [
      { name: "Math", color: "bg-purple-900", icon: "calculate", bannerColor: "bg-purple-950" },
      { name: "Science", color: "bg-red-800", icon: "science", bannerColor: "bg-red-900" },
      { name: "Language Arts", color: "bg-sky-800", icon: "auto_stories", bannerColor: "bg-sky-900" },
      { name: "Social Studies", color: "bg-emerald-800", icon: "public", bannerColor: "bg-emerald-900" },
      { name: "Advisory", color: "bg-cyan-600", icon: "groups", bannerColor: "bg-cyan-700" },
      { name: "Physical Education", color: "bg-amber-800", icon: "fitness_center", bannerColor: "bg-amber-900" },
      { name: "SEARCH", color: "bg-rose-800", icon: "search", bannerColor: "bg-rose-900" },
      { name: "Exploratory Wheel", color: "bg-lime-700", icon: "toys", bannerColor: "bg-lime-800" },
      { name: "Model Engineering", color: "bg-indigo-800", icon: "precision_manufacturing", bannerColor: "bg-indigo-900" },
      { name: "Cooking", color: "bg-orange-700", icon: "restaurant", bannerColor: "bg-orange-800" },
      { name: "Woodshop", color: "bg-yellow-900", icon: "carpenter", bannerColor: "bg-yellow-950" },
      { name: "Leadership", color: "bg-teal-800", icon: "military_tech", bannerColor: "bg-teal-900" },
      { name: "Yearbook", color: "bg-fuchsia-800", icon: "photo_camera", bannerColor: "bg-fuchsia-900" },
      { name: "Study Hall", color: "bg-slate-700", icon: "menu_book", bannerColor: "bg-slate-800" },
      { name: "Beginning Band", color: "bg-blue-800", icon: "music_note", bannerColor: "bg-blue-900" },
      { name: "Beginning Orchestra", color: "bg-indigo-900", icon: "music_video", bannerColor: "bg-indigo-950" },
      { name: "Beginning Choir", color: "bg-pink-800", icon: "mic", bannerColor: "bg-pink-900" },
      { name: "Creative Media", color: "bg-violet-800", icon: "palette", bannerColor: "bg-violet-900" },
      { name: "Art 1", color: "bg-rose-700", icon: "brush", bannerColor: "bg-rose-800" },
      { name: "Drama", color: "bg-amber-900", icon: "theater_comedy", bannerColor: "bg-amber-950" },
      { name: "Forensic Science", color: "bg-neutral-800", icon: "fingerprint", bannerColor: "bg-neutral-900" },
      { name: "ELD 1", color: "bg-sky-700", icon: "translate", bannerColor: "bg-sky-800" },
      { name: "ELD 2", color: "bg-blue-700", icon: "translate", bannerColor: "bg-blue-800" },
      { name: "ELD 3", color: "bg-indigo-700", icon: "translate", bannerColor: "bg-indigo-800" }
    ];

    // Grade calculation including +, -, and plain letter grades
    function calculateGrade(assignments) {
      if (!assignments || assignments.length === 0) return { percent: null, letter: "N/A" };
      let totalEarned = 0;
      let totalMax = 0;
      assignments.forEach(a => {
        totalEarned += Number(a.earnedPoints || 0);
        totalMax += Number(a.totalPoints || 0);
      });
      if (totalMax === 0) return { percent: null, letter: "N/A" };
      const pct = (totalEarned / totalMax) * 100;

      let letter = "F";
      if (pct >= 97) letter = "A+";
      else if (pct >= 93) letter = "A";
      else if (pct >= 90) letter = "A-";
      else if (pct >= 87) letter = "B+";
      else if (pct >= 83) letter = "B";
      else if (pct >= 80) letter = "B-";
      else if (pct >= 77) letter = "C+";
      else if (pct >= 73) letter = "C";
      else if (pct >= 70) letter = "C-";
      else if (pct >= 67) letter = "D+";
      else if (pct >= 63) letter = "D";
      else if (pct >= 60) letter = "D-";
      else letter = "F";

      return { percent: pct.toFixed(1), letter };
    }

    function App() {
      // Persistence for currently active session across refreshes
      const [currentUser, setCurrentUser] = useState(() => {
        return localStorage.getItem("studentvue_current_user") || null;
      });

      const [authUsername, setAuthUsername] = useState("");
      const [authPassword, setAuthPassword] = useState("");
      const [authError, setAuthError] = useState("");

      // Persistent Gradebook Data
      const [classes, setClasses] = useState([]);
      const [selectedClassId, setSelectedClassId] = useState(null);

      // Modals
      const [showAddClass, setShowAddClass] = useState(false);
      const [showEditClass, setShowEditClass] = useState(false);
      const [showAddAssignment, setShowAddAssignment] = useState(false);
      const [showEditAssignment, setShowEditAssignment] = useState(false);

      // Form States
      const [className, setClassName] = useState(SUBJECT_OPTIONS[0].name);
      const [teacherName, setTeacherName] = useState("");
      
      const [assignmentName, setAssignmentName] = useState("");
      const [assignmentType, setAssignmentType] = useState("Homework");
      const [datePosted, setDatePosted] = useState("");
      const [dateDue, setDateDue] = useState("");
      const [earnedPoints, setEarnedPoints] = useState("");
      const [totalPoints, setTotalPoints] = useState("");
      const [notes, setNotes] = useState("");
      const [editingAssignmentId, setEditingAssignmentId] = useState(null);

      // Load persistent user classes whenever session updates
      useEffect(() => {
        if (currentUser) {
          const storedData = localStorage.getItem(`studentvue_classes_${currentUser}`);
          if (storedData) {
            try {
              setClasses(JSON.parse(storedData));
            } catch (err) {
              setClasses([]);
            }
          } else {
            setClasses([]);
          }
        } else {
          setClasses([]);
        }
        setSelectedClassId(null);
      }, [currentUser]);

      // Save user classes to localStorage on every change
      useEffect(() => {
        if (currentUser) {
          localStorage.setItem(`studentvue_classes_${currentUser}`, JSON.stringify(classes));
        }
      }, [classes, currentUser]);

      // Authentication Handler targeting hardcoded login
      const handleLogin = (e) => {
        e.preventDefault();
        setAuthError("");
        const usernameTrimmed = authUsername.trim().toLowerCase();

        if (usernameTrimmed === FIXED_EMAIL.toLowerCase() && authPassword === FIXED_PASS) {
          localStorage.setItem("studentvue_current_user", usernameTrimmed);
          setCurrentUser(usernameTrimmed);
          setAuthUsername("");
          setAuthPassword("");
        } else {
          setAuthError("Invalid email or password.");
        }
      };

      const handleLogout = () => {
        localStorage.removeItem("studentvue_current_user");
        setCurrentUser(null);
      };

      const activeClass = classes.find(c => c.id === selectedClassId);

      // Class Handlers
      const handleAddClass = (e) => {
        e.preventDefault();
        const newClass = {
          id: Date.now().toString(),
          name: className,
          teacher: teacherName || "Unassigned",
          assignments: []
        };
        setClasses(prev => [...prev, newClass]);
        setTeacherName("");
        setShowAddClass(false);
      };

      const handleOpenEditClass = (c, e) => {
        if (e) e.stopPropagation();
        setClassName(c.name);
        setTeacherName(c.teacher);
        setSelectedClassId(c.id);
        setShowEditClass(true);
      };

      const handleSaveEditClass = (e) => {
        e.preventDefault();
        setClasses(prev => prev.map(c => c.id === selectedClassId ? { ...c, name: className, teacher: teacherName } : c));
        setShowEditClass(false);
      };

      const handleDeleteClass = (id, e) => {
        if (e) e.stopPropagation();
        if (window.confirm("Are you sure you want to delete this class?")) {
          setClasses(prev => prev.filter(c => c.id !== id));
          if (selectedClassId === id) setSelectedClassId(null);
        }
      };

      // Assignment Handlers
      const handleAddAssignment = (e) => {
        e.preventDefault();
        if (!activeClass) return;
        const newAssignment = {
          id: Date.now().toString(),
          name: assignmentName,
          type: assignmentType,
          datePosted,
          dateDue,
          earnedPoints: Number(earnedPoints),
          totalPoints: Number(totalPoints),
          notes
        };
        setClasses(prev => prev.map(c => {
          if (c.id === activeClass.id) {
            return { ...c, assignments: [newAssignment, ...c.assignments] };
          }
          return c;
        }));
        resetAssignmentForm();
        setShowAddAssignment(false);
      };

      const handleOpenEditAssignment = (a) => {
        setEditingAssignmentId(a.id);
        setAssignmentName(a.name);
        setAssignmentType(a.type);
        setDatePosted(a.datePosted || "");
        setDateDue(a.dateDue || "");
        setEarnedPoints(a.earnedPoints);
        setTotalPoints(a.totalPoints);
        setNotes(a.notes || "");
        setShowEditAssignment(true);
      };

      const handleSaveEditAssignment = (e) => {
        e.preventDefault();
        setClasses(prev => prev.map(c => {
          if (c.id === selectedClassId) {
            const updated = c.assignments.map(a => {
              if (a.id === editingAssignmentId) {
                return {
                  ...a,
                  name: assignmentName,
                  type: assignmentType,
                  datePosted,
                  dateDue,
                  earnedPoints: Number(earnedPoints),
                  totalPoints: Number(totalPoints),
                  notes
                };
              }
              return a;
            });
            return { ...c, assignments: updated };
          }
          return c;
        }));
        resetAssignmentForm();
        setShowEditAssignment(false);
      };

      const handleDeleteAssignment = (aId) => {
        if (window.confirm("Are you sure you want to delete this assignment?")) {
          setClasses(prev => prev.map(c => {
            if (c.id === selectedClassId) {
              return { ...c, assignments: c.assignments.filter(a => a.id !== aId) };
            }
            return c;
          }));
        }
      };

      const resetAssignmentForm = () => {
        setAssignmentName("");
        setAssignmentType("Homework");
        setDatePosted("");
        setDateDue("");
        setEarnedPoints("");
        setTotalPoints("");
        setNotes("");
        setEditingAssignmentId(null);
      };

      // LOGIN VIEW
      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
            <div className="bg-white p-8 rounded-lg shadow-md max-w-md w-full border border-gray-200">
              <div className="flex items-center justify-center space-x-2 mb-6">
                <span className="material-symbols-outlined text-blue-600 text-4xl">school</span>
                <h1 className="text-2xl font-bold text-gray-800">StudentVUE</h1>
              </div>
              <h2 className="text-lg font-medium text-gray-700 text-center mb-4">
                Sign In to Your Account
              </h2>
              {authError && (
                <div className="bg-red-50 text-red-600 text-sm p-3 rounded mb-4 border border-red-200">
                  {authError}
                </div>
              )}
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-gray-600 mb-1">Email Address</label>
                  <input
                    type="email"
                    required
                    placeholder="vathukrishnaswamy@gmail.com"
                    value={authUsername}
                    onChange={(e) => setAuthUsername(e.target.value)}
                    className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-600 mb-1">Password</label>
                  <input
                    type="password"
                    required
                    placeholder="Enter password"
                    value={authPassword}
                    onChange={(e) => setAuthPassword(e.target.value)}
                    className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                  />
                </div>
                <button
                  type="submit"
                  className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded text-sm transition"
                >
                  Log In
                </button>
              </form>
            </div>
          </div>
        );
      }

      // MAIN APP VIEW
      return (
        <div className="min-h-screen bg-slate-100 flex flex-col">
          <header className="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm">
            <div className="flex items-center space-x-3">
              <span className="material-symbols-outlined text-blue-600 text-3xl">school</span>
              <h1 className="text-xl font-medium text-gray-800">StudentVUE Gradebook</h1>
            </div>
            <div className="flex items-center space-x-4">
              <span className="text-sm font-medium text-gray-600">
                User: <strong className="text-gray-800">{currentUser}</strong>
              </span>
              <button
                onClick={() => setShowAddClass(true)}
                className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium flex items-center gap-2 shadow-sm transition"
              >
                <span className="material-symbols-outlined text-sm">add</span> Add Class
              </button>
              <button
                onClick={handleLogout}
                className="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-md text-sm font-medium transition flex items-center gap-1"
                title="Log Out"
              >
                <span className="material-symbols-outlined text-sm">logout</span> Log Out
              </button>
            </div>
          </header>

          <main className="flex-1 p-6 max-w-7xl mx-auto w-full">
            {activeClass ? (
              <div>
                <button
                  onClick={() => setSelectedClassId(null)}
                  className="mb-4 text-blue-600 hover:underline text-sm font-medium flex items-center gap-1"
                >
                  <span className="material-symbols-outlined text-sm">arrow_back</span> Back to Classes
                </button>

                {(() => {
                  const subjectInfo = SUBJECT_OPTIONS.find(s => s.name === activeClass.name) || SUBJECT_OPTIONS[0];
                  const { percent, letter } = calculateGrade(activeClass.assignments);
                  return (
                    <div className={`${subjectInfo.color} text-white rounded-lg shadow-md p-6 mb-6 flex justify-between items-center relative overflow-hidden`}>
                      <span className="material-symbols-outlined absolute -right-6 -bottom-6 text-white/10 text-9xl pointer-events-none">
                        {subjectInfo.icon}
                      </span>
                      <div>
                        <h2 className="text-2xl font-bold">{activeClass.name}</h2>
                        <p className="text-sm opacity-90">Teacher: {activeClass.teacher}</p>
                      </div>
                      <div className="text-right flex items-center gap-6">
                        <div>
                          <div className="text-3xl font-extrabold">{letter}</div>
                          <div className="text-sm opacity-90">{percent ? `${percent}%` : "No Grade"}</div>
                        </div>
                        <div className="flex gap-2">
                          <button
                            onClick={(e) => handleOpenEditClass(activeClass, e)}
                            className="bg-white/20 hover:bg-white/30 text-white p-2 rounded-full transition"
                            title="Edit Class"
                          >
                            <span className="material-symbols-outlined text-sm">edit</span>
                          </button>
                          <button
                            onClick={(e) => handleDeleteClass(activeClass.id, e)}
                            className="bg-red-500/80 hover:bg-red-600 text-white p-2 rounded-full transition"
                            title="Delete Class"
                          >
                            <span className="material-symbols-outlined text-sm">delete</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })()}

                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-medium text-gray-700">Assignments</h3>
                  <button
                    onClick={() => setShowAddAssignment(true)}
                    className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium flex items-center gap-1 transition shadow-sm"
                  >
                    <span className="material-symbols-outlined text-sm">add</span> Add Assignment
                  </button>
                </div>

                {activeClass.assignments.length === 0 ? (
                  <div className="bg-white rounded-lg p-12 text-center text-gray-500 border border-gray-200">
                    <span className="material-symbols-outlined text-5xl mb-2 text-gray-300">assignment</span>
                    <p>No assignments added yet. Click "+ Add Assignment" to get started.</p>
                  </div>
                ) : (
                  <div className="space-y-3">
                    {activeClass.assignments.map((a) => {
                      const pct = a.totalPoints > 0 ? (a.earnedPoints / a.totalPoints) * 100 : 0;
                      return (
                        <div key={a.id} className="bg-white rounded-lg border border-gray-200 p-4 shadow-sm flex items-center justify-between hover:border-gray-300 transition">
                          <div className="flex items-center gap-4 flex-1">
                            <div className="bg-gray-100 text-gray-600 px-3 py-2 rounded text-center min-w-[80px]">
                              <div className="text-[10px] uppercase tracking-wider font-semibold">Due</div>
                              <div className="text-xs font-bold">{a.dateDue || "N/A"}</div>
                            </div>
                            
                            <div className="flex-1">
                              <div className="flex items-center gap-2">
                                <h4 className="font-semibold text-gray-800">{a.name}</h4>
                                <span className="bg-blue-50 text-blue-700 text-xs px-2 py-0.5 rounded border border-blue-200 font-medium">{a.type}</span>
                              </div>
                              <p className="text-xs text-gray-500 mt-1">{a.earnedPoints} out of {a.totalPoints} pts</p>
                              <div className="w-full bg-gray-200 h-2 rounded-full mt-2 overflow-hidden max-w-md">
                                <div className="bg-emerald-600 h-full rounded-full" style={{ width: `${Math.min(pct, 100)}%` }}></div>
                              </div>
                              {a.notes && <p className="text-xs text-gray-500 italic mt-2">Note: {a.notes}</p>}
                            </div>
                          </div>

                          <div className="flex items-center gap-4 ml-4">
                            <div className="bg-emerald-700 text-white px-4 py-2 rounded text-center min-w-[70px]">
                              <div className="text-lg font-bold">{a.earnedPoints}</div>
                              <div className="text-[10px] opacity-80">Max {a.totalPoints}</div>
                            </div>
                            <div className="flex flex-col gap-1">
                              <button
                                onClick={() => handleOpenEditAssignment(a)}
                                className="text-gray-400 hover:text-blue-600 p-1"
                                title="Edit Assignment"
                              >
                                <span className="material-symbols-outlined text-sm">edit</span>
                              </button>
                              <button
                                onClick={() => handleDeleteAssignment(a.id)}
                                className="text-gray-400 hover:text-red-600 p-1"
                                title="Delete Assignment"
                              >
                                <span className="material-symbols-outlined text-sm">delete</span>
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            ) : (
              <div>
                {classes.length === 0 ? (
                  <div className="bg-white rounded-lg p-16 text-center border border-gray-200 max-w-xl mx-auto my-12">
                    <span className="material-symbols-outlined text-6xl text-gray-300 mb-4">class</span>
                    <h2 className="text-xl font-medium text-gray-700 mb-2">No Classes Added Yet</h2>
                    <p className="text-gray-500 mb-6 text-sm">Start building your StudentVUE schedule by adding your first class.</p>
                    <button
                      onClick={() => setShowAddClass(true)}
                      className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-md font-medium inline-flex items-center gap-2 shadow-sm transition"
                    >
                      <span className="material-symbols-outlined">add</span> Add Your First Class
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {classes.map((c, index) => {
                      const subjectInfo = SUBJECT_OPTIONS.find(s => s.name === c.name) || SUBJECT_OPTIONS[0];
                      const { percent, letter } = calculateGrade(c.assignments);
                      return (
                        <div
                          key={c.id}
                          onClick={() => setSelectedClassId(c.id)}
                          className={`${subjectInfo.color} text-white rounded-lg shadow cursor-pointer transition transform hover:-translate-y-1 hover:shadow-lg relative overflow-hidden flex flex-col justify-between h-36`}
                        >
                          <div className={`${subjectInfo.bannerColor} px-3 py-1.5 flex justify-between items-center text-xs border-b border-white/10`}>
                            <span className="font-semibold truncate">{index + 1}: {c.name}</span>
                            <div className="flex items-center gap-1">
                              <button
                                onClick={(e) => handleOpenEditClass(c, e)}
                                className="p-1 hover:bg-white/20 rounded transition"
                                title="Edit Class"
                              >
                                <span className="material-symbols-outlined text-xs">edit</span>
                              </button>
                              <button
                                onClick={(e) => handleDeleteClass(c.id, e)}
                                className="p-1 hover:bg-red-500/50 rounded transition"
                                title="Delete Class"
                              >
                                <span className="material-symbols-outlined text-xs">delete</span>
                              </button>
                            </div>
                          </div>

                          <div className="p-4 flex justify-between items-center relative z-10">
                            <span className="text-5xl font-extrabold">{letter}</span>
                            <span className="text-xl font-medium">{percent ? `${percent}%` : "N/A"}</span>
                          </div>

                          <span className="material-symbols-outlined absolute right-2 bottom-0 text-white/10 text-8xl pointer-events-none">
                            {subjectInfo.icon}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Modal: Add Class */}
          {showAddClass && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-lg max-w-md w-full p-6 shadow-xl">
                <h3 className="text-lg font-medium text-gray-800 mb-4">Add Class</h3>
                <form onSubmit={handleAddClass} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Class Name</label>
                    <select
                      value={className}
                      onChange={(e) => setClassName(e.target.value)}
                      className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                    >
                      {SUBJECT_OPTIONS.map((s) => (
                        <option key={s.name} value={s.name}>{s.name}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Teacher Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Mr. Smith"
                      value={teacherName}
                      onChange={(e) => setTeacherName(e.target.value)}
                      className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowAddClass(false)}
                      className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700"
                    >
                      Save
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Edit Class */}
          {showEditClass && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-lg max-w-md w-full p-6 shadow-xl">
                <h3 className="text-lg font-medium text-gray-800 mb-4">Edit Class</h3>
                <form onSubmit={handleSaveEditClass} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Class Name</label>
                    <select
                      value={className}
                      onChange={(e) => setClassName(e.target.value)}
                      className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                    >
                      {SUBJECT_OPTIONS.map((s) => (
                        <option key={s.name} value={s.name}>{s.name}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Teacher Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Mr. Smith"
                      value={teacherName}
                      onChange={(e) => setTeacherName(e.target.value)}
                      className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowEditClass(false)}
                      className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700"
                    >
                      Update Class
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Add Assignment */}
          {showAddAssignment && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-lg max-w-md w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
                <h3 className="text-lg font-medium text-gray-800 mb-4">Add Assignment</h3>
                <form onSubmit={handleAddAssignment} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Assignment Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Midterm Exam"
                      value={assignmentName}
                      onChange={(e) => setAssignmentName(e.target.value)}
                      className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-gray-600 mb-1">Type</label>
                      <select
                        value={assignmentType}
                        onChange={(e) => setAssignmentType(e.target.value)}
                        className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                      >
                        <option value="Homework">Homework</option>
                        <option value="Classwork">Classwork</option>
                        <option value="Quiz">Quiz</option>
                        <option value="Test">Test</option>
                        <option value="Project">Project</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-600 mb-1">Due Date</label>
                      <input
                        type="date"
                        value={dateDue}
                        onChange={(e) => setDateDue(e.target.value)}
                        className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-gray-600 mb-1">Earned Points</label>
                      <input
                        type="number"
                        required
                        min="0"
                        step="any"
                        placeholder="e.g. 95"
                        value={earnedPoints}
                        onChange={(e) => setEarnedPoints(e.target.value)}
                        className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-600 mb-1">Total Points</label>
                      <input
                        type="number"
                        required
                        min="1"
                        step="any"
                        placeholder="e.g. 100"
                        value={totalPoints}
                        onChange={(e) => setTotalPoints(e.target.value)}
                        className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Notes (Optional)</label>
                    <textarea
                      value={notes}
                      onChange={(e) => setNotes(e.target.value)}
                      placeholder="Add any extra details..."
                      className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600 h-20"
                    ></textarea>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowAddAssignment(false)}
                      className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700"
                    >
                      Add
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Edit Assignment */}
          {showEditAssignment && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-lg max-w-md w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
                <h3 className="text-lg font-medium text-gray-800 mb-4">Edit Assignment</h3>
                <form onSubmit={handleSaveEditAssignment} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Assignment Name</label>
                    <input
                      type="text"
                      required
                      value={assignmentName}
                      onChange={(e) => setAssignmentName(e.target.value)}
                      className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-gray-600 mb-1">Type</label>
                      <select
                        value={assignmentType}
                        onChange={(e) => setAssignmentType(e.target.value)}
                        className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                      >
                        <option value="Homework">Homework</option>
                        <option value="Classwork">Classwork</option>
                        <option value="Quiz">Quiz</option>
                        <option value="Test">Test</option>
                        <option value="Project">Project</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-600 mb-1">Due Date</label>
                      <input
                        type="date"
                        value={dateDue}
                        onChange={(e) => setDateDue(e.target.value)}
                        className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-gray-600 mb-1">Earned Points</label>
                      <input
                        type="number"
                        required
                        min="0"
                        step="any"
                        value={earnedPoints}
                        onChange={(e) => setEarnedPoints(e.target.value)}
                        className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-600 mb-1">Total Points</label>
                      <input
                        type="number"
                        required
                        min="1"
                        step="any"
                        value={totalPoints}
                        onChange={(e) => setTotalPoints(e.target.value)}
                        className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Notes (Optional)</label>
                    <textarea
                      value={notes}
                      onChange={(e) => setNotes(e.target.value)}
                      className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-600 h-20"
                    ></textarea>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowEditAssignment(false)}
                      className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700"
                    >
                      Save Changes
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
